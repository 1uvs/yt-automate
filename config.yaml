# Which streamers to pull clips from (Twitch usernames / login names).
streamers:
  - kaicenat
  - jasontheween
  - ksi
  - duke
  - agent00
  - fanum

# Streamers NOT on Twitch (e.g. IShowSpeed on YouTube). We pull recent uploads,
# auto-detect the loudest/hype moments, and cut them into clips.
youtube_streamers:
  - name: ishowspeed
    channel: https://www.youtube.com/@IShowSpeed
    scan_videos: 8          # look at this many recent uploads per run
    max_videos: 1           # analyze the newest qualifying upload (keeps balance)
    highlights_per_video: 2 # clips to cut from it
    min_video_sec: 90       # ignore uploads shorter than this
    max_video_sec: 5400     # ...or longer than 90 min (skip full multi-hour streams)
    clip_len_sec: 30
    max_height: 1080
    skip_titles:            # skip copyrighted / promo uploads (music videos, trailers)
      - music video
      - official video
      - official audio
      - "(official"
      - lyric
      - teaser
      - trailer

# How far back to look for top clips, and how many per streamer per run.
lookback_hours: 72           # 3 days — wider net so every streamer has clips to pick from
clips_per_streamer: 2        # cap per streamer so the queue stays diverse (no one dominates)
min_view_count: 150          # skip clips below this many views (raise once channels get busy)
min_duration_sec: 8          # too short = no story
max_duration_sec: 75         # YouTube Shorts hard limit is 60s of final render; source can be longer

# Rendering
render:
  layout: blur_pad           # blur_pad | center_crop  (blur_pad keeps the whole frame)
  target_w: 1080
  target_h: 1920
  max_final_sec: 58          # trim final vertical clip to stay in Shorts territory
  caption_style: karaoke     # karaoke = word-by-word highlight (the "viral" look)

# Publishing
publish:
  privacy_on_approve: public # public | unlisted | private  (what an approved clip becomes)
  category_id: "24"          # 24 = Entertainment
  made_for_kids: false
  tags_extra:
    - shorts
    - clips
    - viral
