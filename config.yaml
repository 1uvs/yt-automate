# Which streamers to pull clips from (Twitch usernames / login names).
# Big roster of high-clip-volume Twitch streamers (all validated to exist). On any
# given day some are offline, so a wide roster keeps the variety + volume flowing.
# The coach learns which convert best and prioritizes them over time.
streamers:
  # AMP / big personalities / reaction
  - kaicenat
  - agent00
  - dukedennis
  - fanum
  - jasontheween
  - chrisnxtdoor
  - rayasianboy
  - plaqueboymax
  - stableronaldo
  - lacy
  - silky
  - yourragegaming
  # IRL / variety
  - extraemily
  - emiru
  - nmplol
  - sodapoppin
  - mizkif
  - sykkuno
  # gaming
  - jynxzi
  - xqc
  - caseoh_
  - clix
  - tarik
  - summit1g
  - ludwig
  # more high-clip creators
  - ironmouse
  - quackity
  - pokimane

# Streamers NOT on Twitch (e.g. IShowSpeed on YouTube). We pull recent uploads,
# auto-detect the loudest/hype moments, and cut them into clips.
youtube_streamers:
  - name: ishowspeed
    channel: https://www.youtube.com/@IShowSpeed
    scan_videos: 8          # look at this many recent uploads per run
    max_videos: 1           # analyze the newest qualifying upload (keeps balance)
    highlights_per_video: 2 # clips to cut from it
    min_video_sec: 90       # ignore uploads shorter than this
    max_video_sec: 5400     # ...or longer than 90 min (skip full multi-hour streams)
    clip_len_sec: 30
    max_height: 1080
    skip_titles:            # skip copyrighted / promo uploads (music videos, trailers)
      - music video
      - official video
      - official audio
      - "(official"
      - lyric
      - teaser
      - trailer

# How far back to look for top clips, and how many per streamer per run.
lookback_hours: 96           # 4 days — wider net so every streamer has clips to pick from
clips_per_streamer: 2        # cap per streamer so the queue stays diverse (no one dominates)
min_view_count: 150          # skip clips below this many views (raise once channels get busy)
max_clips_per_run: 24        # total cap per run (variety-first: 1 from each streamer first)
min_duration_sec: 8          # too short = no story
max_duration_sec: 75         # YouTube Shorts hard limit is 60s of final render; source can be longer

# Captions: we add animated word-by-word captions (the viral look). Some streamers
# already burn their own captions into their stream — list them here so we don't
# stack two sets of captions on top of each other.
captions:
  enabled: true
  skip_if_burned_in: true    # auto-detect clips that already have burned-in captions
                             # and skip ours (avoids the "double captions" look)
  skip_streamers:
    - jasontheween           # streams with his own burned-in captions
  transcribe_when_captions_off: true
                             # Still transcribe clips whose captions we skip. Costs a
                             # little time, but the transcript is what the safety
                             # screener and the title writer read — without it those
                             # clips get generic titles and a blind screening pass.

# Rendering
render:
  layout: center_crop        # center_crop = full-screen (recommended) | blur_pad = blurred bars
  target_w: 1080
  target_h: 1920
  max_final_sec: 58          # trim final vertical clip to stay in Shorts territory.
                             # Sources longer than this are trimmed to their LOUDEST
                             # stretch (the payoff), not just the first 58 seconds.
  caption_style: karaoke     # karaoke = word-by-word highlight (the "viral" look)

# A/B virality testing: rotate variants across clips, then use YouTube Analytics to
# learn which performs best on YOUR channel. Set enabled: false to always use render.layout.
ab_test:
  enabled: true
  variants:
    - name: crop             # full-screen
      layout: center_crop
    - name: blur             # blurred bars
      layout: blur_pad

# GPT safety + quality gate: before rendering, each candidate clip is screened for
# copyright/brand risk (licensed music, TV/movie footage, slurs, sensitive incidents)
# and viral potential. High-risk or clearly-weak clips are rejected before any render/
# upload. Fails open (allows the clip) if OpenAI is unavailable. Needs OPENAI_API_KEY.
screening:
  enabled: true
  block_high_risk: true   # reject clips GPT flags as high copyright/brand risk
  min_quality: 25         # reject clips scoring below this (0-100); 0 = never on quality

# Thumbnails: use GPT-5.4 vision to pick the most clickable frame (visible face, strong
# emotion, motion clarity) instead of ffmpeg's generic pick. Falls back automatically.
thumbnail:
  vision: true

# The "strategy brain": a bigger GPT model reviews your real YouTube analytics once
# a day (inside autopilot) and rewrites the generation strategy — title formulas,
# hook style, which streamers to prioritize, which hashtags to push — that new clips
# are generated toward. Auto-applied; every version saved to data/strategy_history/.
# Needs OPENAI_API_KEY (with billing) + a few published clips before it has signal.
strategy:
  enabled: true

# Speed knobs. Downloading is network-bound and rendering is CPU-bound, so the
# pipeline keeps a couple of downloads running ahead of the clip it's working on.
# Lower these if your connection or Mac struggles; 0 prefetch = fully sequential.
performance:
  discovery_workers: 8       # parallel Twitch clip-list lookups during discovery
  download_workers: 2        # clip downloads in flight at once
  prefetch_depth: 2          # how many clips ahead to pre-download

# Fully hands-off mode (autopilot.py): generate + auto-schedule with no review.
autopilot:
  max_per_run: 8             # safety cap: never schedule more than this per run
  include_youtube: false     # IShowSpeed's VOD download is slow (~15 min); keep autopilot
                             # fast + reliable with Twitch only. Use manual Generate for Speed.

# Scheduled posting — approved clips upload as private and auto-go-public at these
# local times, dripped one per slot so you never dump them all at once.
schedule:
  timezone: auto             # auto = your Mac's local time, or e.g. "America/New_York"
  slots:                     # peak engagement windows (24h local time)
    - "12:00"
    - "15:00"
    - "18:00"
    - "21:00"

# Publishing
publish:
  privacy_on_approve: public # public | unlisted | private  (what an approved clip becomes)
  category_id: "24"          # 24 = Entertainment
  made_for_kids: false
  tags_extra:
    - shorts
    - clips
    - viral
